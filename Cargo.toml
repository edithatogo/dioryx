[workspace]
resolver = "3"
members = [
    "crates/storage-io",
    "crates/container-core",
    "crates/volume-core",
    "crates/transform-core",
    "crates/semantics-core",
    "crates/fs-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
thiserror = "=2.0.21"
unicode-normalization = "=0.1.26"
storage-io = { path = "crates/storage-io" }
semantics-core = { path = "crates/semantics-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
