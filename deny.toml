# Minimal policy for the current workspace. Expand licences only with an evidenced admission.
[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "ISC"]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
